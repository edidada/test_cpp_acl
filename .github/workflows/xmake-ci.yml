name: xmake CI

on:
  push:
    branches: [xmake]
  workflow_dispatch:

jobs:
  xmake:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux (Ubuntu 22.04 / gcc-11)
          - os: macos-14
            name: macOS (macos-14 / clang-15)
          - os: windows-2022
            name: Windows (windows-2022 / MSVC 2022)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install gcc-11 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-11 g++-11
          echo "CC=gcc-11" >> "$GITHUB_ENV"
          echo "CXX=g++-11" >> "$GITHUB_ENV"

      - name: Install clang-15 (macOS)
        if: runner.os == 'macOS'
        run: |
          # llvm@15 may be bottled or not; never let a source build eat the job.
          timeout 900 brew install llvm@15 || echo "::notice::llvm@15 unavailable, falling back to default clang"
          if [ -x "$(brew --prefix llvm@15 2>/dev/null)/bin/clang++" ]; then
            LLVM15="$(brew --prefix llvm@15)"
            echo "CC=$LLVM15/bin/clang"   >> "$GITHUB_ENV"
            echo "CXX=$LLVM15/bin/clang++" >> "$GITHUB_ENV"
          else
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Setup MSVC 2022 (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@master
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/AppData/Local/xmake/packages
          key: xmake-pkgs-${{ runner.os }}-acl-dev-3.6.7-v1
          restore-keys: xmake-pkgs-${{ runner.os }}-acl-dev-

      - name: Update xmake-repo
        run: xrepo update-repo

      - name: Configure (xmake)
        run: xmake f -m release -y

      - name: Build (xmake, parallelism capped at 2)
        run: xmake -j2 -y

      - name: Run smoke test (xmake run xmake_smoke)
        run: xmake run xmake_smoke
