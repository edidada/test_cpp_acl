name: Build and Test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Fetch known-good sqlite3.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/sqlite3 | Out-Null
          Invoke-WebRequest -Uri https://www.sqlite.org/2025/sqlite-dll-win-x64-3500400.zip -OutFile build/sqlite3.zip
          Expand-Archive -Path build/sqlite3.zip -DestinationPath build/sqlite3 -Force
          Get-ChildItem build/sqlite3

      - name: Run tests (ctest)
        env:
          ACL_DB_LOADPATH: ${{ runner.os == 'Windows' && format('{0}/build/sqlite3/sqlite3.dll', github.workspace) || '' }}
        run: ctest --test-dir build -C Release --output-on-failure --timeout 60
